# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# Dashboard: https://sonarcloud.io/project/overview?id=drzbraz_deus.ai
#
# The keys must match the project created on sonarcloud.io; they are shown
# under Administration > General Settings if they ever differ.
sonar.organization=drzbraz
sonar.projectKey=drzbraz_deus.ai
sonar.projectName=Logistics API

# Production code vs. tests. Everything under tests/ (black-box suites and
# their harness) counts as test code.
# migrations/ is excluded because Sonar's SQL analyzer targets Oracle PL/SQL,
# where '' IS NULL; in PostgreSQL `CHECK (name <> '')` is correct (proven by
# tests/schema), and applied migrations must never be edited anyway.
sonar.sources=.
sonar.exclusions=**/*_test.go,tests/**,deploy/**,migrations/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**

# Reports produced earlier in the pipeline.
#   coverage.out        every suite with -coverpkg=./internal/... (make ci-test)
#   golangci-report.xml golangci-lint findings in checkstyle format
sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-report.xml

# The entry point only wires dependencies and handles signals; it is
# exercised end to end, not by unit coverage.
sonar.coverage.exclusions=cmd/**
