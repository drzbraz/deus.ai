# Disposable infrastructure for integration tests (`make test-integration`).
# Data lives in tmpfs, so every run starts from a clean database.
name: logistics-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deus
      POSTGRES_PASSWORD: deus
      POSTGRES_DB: logistics_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deus -d logistics_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq-test:
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: deus_user
      RABBITMQ_DEFAULT_PASS: deus_pass
    ports:
      - "56720:5672"
      - "56721:15672"
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Runs the integration suite inside Docker, so no local Go toolchain is needed:
  #   docker compose -f docker-compose.test.yml run --rm tests
  tests:
    profiles: ["tests"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://deus:deus@postgres-test:5432/logistics_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://deus_user:deus_pass@rabbitmq-test:5672/
    depends_on:
      postgres-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
