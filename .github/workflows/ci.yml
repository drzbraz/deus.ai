name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Latest 1.26 patch release, so security fixes in the standard library are picked up.
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make vuln

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  integration:
    name: Integration, e2e, resilience & schema tests + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deus
          POSTGRES_PASSWORD: deus
          POSTGRES_DB: logistics_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U deus -d logistics_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:management
        env:
          RABBITMQ_DEFAULT_USER: deus_user
          RABBITMQ_DEFAULT_PASS: deus_pass
        ports: ["56720:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 3s --health-timeout 5s --health-retries 40
    env:
      TEST_DATABASE_URL: postgres://deus:deus@localhost:55432/logistics_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://deus_user:deus_pass@localhost:56720/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run every suite with the race detector and the coverage gate
        run: make ci-test
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore

  stack:
    name: Docker stack + black-box e2e
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet
      - name: Build the image and start the full stack
        run: make docker-run
      - name: Run the e2e and schema suites against the deployed stack
        run: make test-e2e-stack
      - name: API logs
        if: failure()
        run: docker compose logs api
      - name: Tear down
        if: always()
        run: make docker-down
