name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (tags can be moved to other code);
# Dependabot keeps the pins and their version comments up to date.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Latest 1.26 patch release, so security fixes in the standard library are picked up.
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          # Readable output in the log, plus a checkstyle report for SonarQube Cloud.
          args: --output.text.path=stdout --output.checkstyle.path=golangci-report.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: golangci-report
          path: golangci-report.xml
          if-no-files-found: ignore

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make vuln

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  integration:
    name: Integration, e2e, resilience & schema tests + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deus
          POSTGRES_PASSWORD: deus
          POSTGRES_DB: logistics_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U deus -d logistics_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4-management
        env:
          RABBITMQ_DEFAULT_USER: deus_user
          RABBITMQ_DEFAULT_PASS: deus_pass
        ports: ["56720:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 3s --health-timeout 5s --health-retries 40
    env:
      TEST_DATABASE_URL: postgres://deus:deus@localhost:55432/logistics_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://deus_user:deus_pass@localhost:56720/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run every suite with the race detector and the coverage gate
        run: make ci-test
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore

  stack:
    name: Docker stack + black-box e2e
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet
      - name: Build the image and start the full stack
        run: make docker-run
      - name: Run the e2e and schema suites against the deployed stack
        run: make test-e2e-stack
      - name: API logs
        if: failure()
        run: docker compose logs api
      - name: Tear down
        if: always()
        run: make docker-down

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [lint, integration]
    env:
      # Secrets are not available to pull requests from forks, and the job
      # must not fail before the SONAR_TOKEN secret has been configured.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip when SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set; skipping the SonarQube Cloud analysis."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # full history, so Sonar can tell new code from old
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.SONAR_TOKEN != ''
        with:
          name: golangci-report
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        if: env.SONAR_TOKEN != ''
